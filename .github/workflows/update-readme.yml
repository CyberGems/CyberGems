# .github/workflows/update-readme.yml
# Auto-actualiza la tabla de repos en el README del perfil
# Coloca este archivo en CyberGems/CyberGems/.github/workflows/update-readme.yml

name: Update Profile README

on:
  schedule:
    - cron: '0 6 * * *' # cada día a las 06:00 UTC
  workflow_dispatch: # permite lanzarlo manual
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-readme.yml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch repos and update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: repos } = await github.rest.repos.listForUser({
              username: 'CyberGems',
              per_page: 100,
              sort: 'updated'
            });
            
            const SITE_OWNER = 'CyberGems';
            const SITE_REPO = 'CyberGems.github.io';

            // Repos excluidos del perfil (no son apps): el propio perfil, la web
            // y el repo de archivos de comunidad, que nunca debe salir en la tabla.
            const EXCLUDE = new Set(['CyberGems', SITE_REPO, '.github']);

            // La web es la fuente de verdad: solo sus apps con published=true
            // aparecen aquí. Así CyberGo (alpha) y CyberFiles (pre-release)
            // quedan fuera aunque algún release esté mal marcado como estable.
            const { data: appDir } = await github.rest.repos.getContent({
              owner: SITE_OWNER,
              repo: SITE_REPO,
              path: 'src/data/apps'
            });
            const appFiles = appDir.filter(item => item.type === 'file' && item.name.endsWith('.json'));
            const manifests = await Promise.all(appFiles.map(async (item) => {
              const { data: file } = await github.rest.repos.getContent({
                owner: SITE_OWNER,
                repo: SITE_REPO,
                path: item.path
              });
              return JSON.parse(Buffer.from(file.content.replace(/\n/g, ''), 'base64').toString('utf8'));
            }));
            const publishedSlugs = new Set(
              manifests.filter(app => app.published === true).map(app => app.slug.toLowerCase())
            );
            if (publishedSlugs.size === 0) {
              throw new Error('No published apps found in the website manifests');
            }

            // Filtrar solo repos públicos no-fork que estén publicados en la web.
            const filtered = repos
              .filter(r => !r.fork && !EXCLUDE.has(r.name))
              .sort((a,b) => a.name.localeCompare(b.name));
            const published = filtered.filter(repo => publishedSlugs.has(repo.name.toLowerCase()));
            for (const repo of filtered) {
              if (!publishedSlugs.has(repo.name.toLowerCase())) console.log(`Hidden draft app: ${repo.name}`);
            }

            const langBadge = (lang) => {
              const map = {
                'C#': { color: '239120', logo: 'csharp' },
                'TypeScript': { color: '3178C6', logo: 'typescript' },
                'JavaScript': { color: 'F7DF1E', logo: 'javascript', logoColor: 'black' },
                'HTML': { color: 'E34F26', logo: 'html5' },
              };
              const cfg = map[lang] || { color: 'lightgrey', logo: '' };
              const lc = cfg.logoColor ? `&logoColor=${cfg.logoColor}` : '&logoColor=white';
              return `![${lang}](https://img.shields.io/badge/${encodeURIComponent(lang)}-${cfg.color}?style=flat-square&logo=${cfg.logo}${lc})`;
            };

            // Iconos oficiales: PNG commiteado en cada repo de app. Si se
            // actualiza el original, el README lo refleja solo (URL raw).
            // Repos sin entrada usan el emoji como fallback.
            const iconMap = {
              'CyberClock': 'src-tauri/icons/icon.png',
              'CyberFeeds': 'resources/icon.png',
              'CyberFiles': 'public/icon.png',
              'CyberGo': 'public/icon.png',
              'CyberLauncher': 'public/icon-256.png',
              'CyberManager': 'src/CyberManager.UI/Assets/CyberManager.png',
              'CyberNotes': 'assets/icon.png',
              'CyberPaste': 'src-tauri/icons/icon.png',
              'CyberSnap': 'src/CyberSnap/Assets/CyberSnap_square.png',
              'CyberTray': 'public/icon.png',
              'CyberViewer': 'assets/icon.png',
              'CyberWall': 'src/CyberWall.UI/Assets/CyberWall.png'
            };

            const emojiMap = {
              'CyberWall': '🛡️', 'CyberViewer': '💫', 'CyberSnap': '📸',
              'CyberPaste': '📋', 'CyberNotes': '📝', 'CyberFeeds': '📢',
              'CyberClock': '🕐', 'CyberLauncher': '🚀', 'CyberTray': '⚡',
              'CyberManager': '💻', 'CyberGo': '🗓️', 'CyberFiles': '📁'
            };

            // La rama por defecto la informa la API. Antes había dos repos
            // (CyberClock y CyberWall) clavados como 'master', así que al
            // cambiarla o al añadir otro repo con master los iconos se
            // rompían en silencio.
            const iconFor = (repo) => {
              const path = iconMap[repo.name];
              // Icono ARRIBA del nombre y todo centrado (columna :---:):
              // una sola unidad sin oportunidades de salto de línea.
              if (path) return `[<img src="https://raw.githubusercontent.com/CyberGems/${repo.name}/${repo.default_branch}/${path}" width="32" alt="${repo.name} icon"><br>**${repo.name}**](https://github.com/CyberGems/${repo.name})`;
              return `${emojiMap[repo.name] || '📦'}&nbsp;[**${repo.name}**](https://github.com/CyberGems/${repo.name})`;
            };

            const rows = published.map(r => {
              const desc = (r.description || '').replace(/\|/g, '\\|').trim();
              const badge = r.language ? langBadge(r.language) : '';
              return `| ${iconFor(r)} | ${desc} | ${badge} |`;
            }).join('\n');

            let readme = fs.readFileSync('README.md', 'utf8');
            const start = '<!-- REPOS:START -->';
            const end = '<!-- REPOS:END -->';
            const header = `| App | Description | Stack |\n|:---:|---|---|`;
            const newSection = `${start}\n${header}\n${rows}\n${end}`;
            
            if (readme.includes(start) && readme.includes(end)) {
              readme = readme.replace(new RegExp(`${start}[\\s\\S]*?${end}`), newSection);
            } else {
              // Fallback: añade al final si no existen marcadores
              readme += `\n\n${newSection}\n`;
            }
            
            // El badge de "apps publicadas" estaba escrito a mano y se quedaba
            // desfasado cada vez que una app entraba o salía de la tabla.
            // Se recalcula junto con la tabla para que ambos digan lo mismo.
            readme = readme.replace(
              /Apps-\d+%20Published/,
              `Apps-${published.length}%20Published`
            );

            fs.writeFileSync('README.md', readme);
            console.log(`Updated ${published.length} repos`);

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add README.md && git commit -m "chore: auto-update repos list" && git push)
